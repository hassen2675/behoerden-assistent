<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <title>Brifo — KI-Assistent für deutsche Behördenbriefe</title>
    <meta name="description" content="Brifo — Ihre App für deutsche Behördenbriefe. KI übersetzt, erklärt und schreibt Antworten in 9 Sprachen." />
    
    <link rel="manifest" href="/manifest.json" />
    
    <meta name="theme-color" content="#3B82F6" />
    <meta name="background-color" content="#FAFAF9" />
    
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Brifo" />
    <link rel="apple-touch-icon" href="/icon-180-apple.png" />
    
    <meta name="msapplication-TileColor" content="#3B82F6" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
    
    <meta property="og:title" content="Brifo — KI-Assistent für Behördenbriefe" />
    <meta property="og:description" content="KI für deutsche Behördenbriefe in 9 Sprachen" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/service-worker.js")
            .then((registration) => {
              console.log("✓ Service Worker registriert:", registration.scope);
            })
            .catch((error) => {
              console.log("Service Worker Fehler:", error);
            });
        });
      }
    </script>
  </body>
</html>
