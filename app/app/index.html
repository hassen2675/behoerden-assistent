<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- App Title -->
    <title>Behörden Assistent — KI für Ausländer in Deutschland</title>
    <meta name="description" content="KI-Assistent für Ausländer in Deutschland. Behördenbriefe verstehen, übersetzen und beantworten in 9 Sprachen." />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme Colors -->
    <meta name="theme-color" content="#0F172A" />
    <meta name="background-color" content="#FAFAF9" />
    
    <!-- App Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    
    <!-- Apple Specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Behörden" />
    <link rel="apple-touch-icon" href="/icon-180-apple.png" />
    
    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#0F172A" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
    
    <!-- SEO Open Graph -->
    <meta property="og:title" content="Behörden Assistent" />
    <meta property="og:description" content="KI-Assistent für Ausländer in Deutschland in 9 Sprachen" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Service Worker Registrierung -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/service-worker.js")
            .then((registration) => {
              console.log("✓ Service Worker registriert:", registration.scope);
            })
            .catch((error) => {
              console.log("Service Worker Fehler:", error);
            });
        });
      }
    </script>
  </body>
</html>
